name: nbbang

services:
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "127.0.0.1:47420:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "47421"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: nbbang
      POSTGRES_USER: nbbang
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env.local}
    ports:
      - "127.0.0.1:47422:47421"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:47421/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    image: postgres:17-alpine
    container_name: nbbang-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nbbang
      POSTGRES_USER: nbbang
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
    ports:
      - "127.0.0.1:47430:5432"
    volumes:
      - nbbang_postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nbbang -d nbbang"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  nbbang_postgres_data:

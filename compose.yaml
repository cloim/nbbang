services:
  db:
    image: postgres:17-alpine
    container_name: nbbang-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nbbang
      POSTGRES_USER: nbbang
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
    ports:
      - "127.0.0.1:47430:5432"
    volumes:
      - nbbang_postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nbbang -d nbbang"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  nbbang_postgres_data:
